[package]
name = "zetsu"
version = "0.2.0"
edition = "2021"
description = "A minimal, vim-like terminal IDE with mouse support"
repository = "https://github.com/erenmentes/zetsu"
license = "MIT"
build = "build.rs"

[dependencies]
crossterm = "0.28"
unicode-width = "0.2"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3", default-features = false }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
