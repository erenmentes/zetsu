name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a Rust file
        2. Press `gd` on a symbol
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zetsu version
      description: Output of `zetsu --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator
      placeholder: Windows Terminal, iTerm2, Alacritty, ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: For language server issues, attach the output of `ZETSU_LSP_LOG=lsp.log zetsu`.
